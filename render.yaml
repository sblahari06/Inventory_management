services:
  - type: web
    name: inventory-management-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: CORS_ORIGINS
        sync: false
